---
# Where the deploy lives on the server. The compose PROJECT name derives from this
# directory's basename, so renaming it (per deployment) namespaces the whole stack.
app_dir: /opt/claude-tg-bot

# Container names are "<container_prefix>-bot | -dind | -caddy" (the playbook health-check
# uses the same). Override per deployment so two bots on one host don't collide.
container_prefix: claude-tg

# Migration aid for renaming the compose project without losing data. When set, the
# compose volumes are declared EXTERNAL as "<legacy_volume_project>_<vol>" instead of
# being project-managed — so a renamed project/dir REUSES the existing data volumes
# rather than creating empty ones (no 36G copy; disk-safe). Leave EMPTY for fresh
# installs (volumes are auto-created and managed by the new project as usual).
legacy_volume_project: ""

# Prebuilt image — pulled, not built (agents/CLAUDE.md are baked in by CI).
# The tag is resolved against the registry on the first install. Afterwards an ordinary
# playbook run (token rotation, a limit change) does not go looking for a newer build: it
# (re)starts the container on whatever this tag points to LOCALLY on that host, so :latest
# does not track main by itself. Three things still move a deployment onto another image:
#   - the opt-in fetch below (-e bot_image_pull=true) — the intended update path;
#   - the local tag having been moved out of band, by a pull run by hand on the host or by
#     an opt-in fetch whose (re)start did not complete: the next ordinary run lands on it;
#   - the host no longer having an image for the tag — the first install, or a `compose down`
#     that left it unreferenced until the weekly prune reclaimed it. Compose fetches what is
#     missing in order to start the stack, which resolves the tag against the registry again.
# Pin a tag (e.g. :v1) to make the version explicit in the inventory; to move a
# deployment forward, re-run with -e bot_image_pull=true (see below).
bot_image: "ghcr.io/duckbugio/flock-telegram:latest"

# Update switch. false (default) = the run does not go looking for a newer image; the stack
# (re)starts on what this host already has (compose still fetches an image that is missing
# locally — the first install, or one the prune reclaimed). true = fetch what the tags
# currently point to first, so the (re)start below lands on them. Updating is therefore a
# deliberate operator action:
#   ansible-playbook -i inventories/<name>/inventory.ini playbook.yml -e bot_image_pull=true
# The fetch covers the sidecars as well, not only {{ bot_image }}: their tags float within a
# major too and dind runs privileged, so within the role this switch is their only update
# path — a privileged container has to have one.
# It is a variable rather than an Ansible tag on purpose — a tag would be a second,
# partly overlapping switch, and selecting only the pull task with --tags would skip the
# (re)start that actually puts the new image into service.
bot_image_pull: false

# Node major version for the bundled `claude` CLI
node_major: 22

# Fallback if not set in group_vars/all/vars.yml
approved_directory: /workspace

# Bot "environment" string. IMPORTANT: the values development / testing / production
# trigger HARDCODED overrides inside the bot (production forces $5/user + 5 req/min,
# clobbering the limits below — see src/config/environments.py). Any OTHER value makes
# the bot honor the env vars below verbatim. The whitelist stays enforced regardless,
# because that is driven by debug + development_mode (both false), not by this string.
bot_environment: prod

# Swap — the server ships with 0 swap; give Node headroom
swap_file: /swapfile
swap_size_gb: 2

# Container memory ceiling (host has ~3.9 GB + swap)
container_mem_limit: 3g

# AI backend. "claude" preserves the existing path; "codex" runs Codex CLI with
# the same bot/workspace/session layer.
ai_backend: claude

# Claude cost caps. With a subscription nothing is billed per token, so these are
# generous (effectively no throttle). If you switch to api_key mode, LOWER them
# (e.g. 10 / 5) to avoid surprise spend.
claude_max_cost_per_user: "1000.0"
claude_max_cost_per_request: "100.0"
# Headroom for multi-step team runs (coder→tester→reviewer→arbiter→PR in one session)
claude_max_turns: 250
claude_timeout_seconds: 10800  # 3h — big multi-step team builds run long in one turn
# Model for the team (subagents inherit it). Opus 4.8 = best; costly on api_key mode.
claude_model: "claude-opus-4-8"

# Codex backend defaults. subscription mode uses a persisted CODEX_HOME/auth.json
# or CODEX_ACCESS_TOKEN. billing mode requires CODEX_API_KEY plus codex_billing_ack=true.
codex_auth_mode: subscription
codex_bin: codex
codex_home: /home/claude/.codex
codex_model: "gpt-5.5"
codex_require_auth: true
codex_billing_ack: false
codex_sandbox: workspace-write
codex_approval_policy: never
codex_skip_git_repo_check: false
codex_extra_args: ""

# OpenAI-compatible answer-only provider. Works for Qwen via Alibaba
# DashScope/Model Studio, DeepSeek, OpenRouter, LiteLLM, vLLM, LM Studio, etc.
# It does not edit files or run shell tools in v1.
openai_compat_base_url: ""
openai_compat_model: ""
openai_compat_api_key_env: OPENAI_COMPAT_API_KEY
openai_compat_auth_mode: api_key
openai_compat_billing_ack: false
openai_compat_timeout_seconds: 300

# Telegram rate limiting (per user)
rate_limit_requests: 30
rate_limit_window: 60

# Chats that may run concurrently (each chat stays serial within itself). Different users get
# answered in parallel up to this; it caps memory. 1 = fully serial (old behavior). ~3.9GB host:
# keep modest to avoid OOM from parallel Opus runs.
max_concurrent_chat_runs: 4

# Dev-team loop limits (tune without touching code)
pre_pr_cycles: 5      # coder<->tester rounds to get green BEFORE opening a PR
pr_review_cycles: 10  # reviewer<->coder rounds ON the open PR, then arbiter approves/escalates

# Telegram Bot API rich messages are experimental; keep the legacy
# MarkdownToHTML/plain delivery path by default.
enable_rich_messages: false

# Group-chat mention behavior: false = answer every message in groups (default);
# true = only answer on @mention/reply. Private chats are always answered.
require_group_mention: false
# Published-PR review/fix loop (PR-comment poller + CLAUDE.md Phase 2). false = off (default):
# build + open a PR, then stop. true = react to PR comments + run the on-PR review loop.
enable_pr_review: false

# Webhook PR-monitoring (enabled when webhook_domain is set in group_vars/all/vars.yml)
webhook_domain: ""
notification_chat_ids: ""
# Floats within major 2; like dind, the role moves it on an -e bot_image_pull=true run — or,
# as with bot_image above, when the host has no copy of the tag left to start from.
caddy_image: "caddy:2-alpine"

# PR poller cadence (seconds). The bot polls Gitea for new PR comments — the reliable
# path when inbound webhooks can't be delivered (e.g. cross-border network filtering).
# Active whenever gitea_host is set; 0 disables it.
gitea_poll_interval: 90

# Docker-in-Docker sidecar so the team can run dockerized linters/tests. ON by
# default; set to false on hosts that cannot run a privileged container.
# The tag floats within major 27, and this container is privileged: the role moves it when a
# run with -e bot_image_pull=true fetches the stack, or when the host has no copy of the tag
# left to start from (see bot_image above).
enable_dind: true
dind_image: "docker:27-dind"

# Weekly reclaim of unused Docker images + build cache via a systemd timer. The age it
# filters on is the image's CREATION time (when CI built it), not when this host pulled it,
# so a just-pulled image is usually already past docker_prune_keep_hours and is reclaimed
# once nothing runs it — after an update, rolling back to the previous image normally means
# pulling that tag again. The prune skips any image a container still references, so the
# version in service stays; an image nothing references — e.g. after a `compose down` — is
# reclaimed, and the next ordinary run fetches that tag again to bring the stack up.
# Set enable_docker_prune: false to skip.
enable_docker_prune: true
docker_prune_schedule: "weekly"   # systemd OnCalendar (weekly | daily | "Sun *-*-* 04:00:00")
docker_prune_keep_hours: 168      # keep anything newer than this many hours (168 = 7 days)

# MCP tools (Claude backend only). context7 = live library docs (free, no key).
# DuckBug MCP activates when vault_duckbug_mcp_token is set in vault.yml — the team
# then reads the project's live errors/logs from DuckBug; self-hosted deployments
# override duckbug_mcp_url with <their-duckbug>/api/mcp.
enable_context7: true
duckbug_mcp_url: "https://duckbug.io/api/mcp"

# Autonomy loops (see adapters/telegram/.env.example for the full story).
# Post-run verification re-runs changed repos' own check gates after every run.
enable_post_verify: true
post_verify_max_fixes: 2
post_verify_timeout_seconds: 1800
# /goal evaluator rounds cap + optional cheaper judge model.
goal_max_attempts: 5
evaluator_model: ""
goal_eval_timeout_seconds: 1800
# CI watch: red build → fix-up run; green build → wake the chat. Auto-merge merges
# a green PR (full hands-off) — keep false to leave merges to the human.
enable_ci_watch: false
ci_poll_interval: 120
enable_auto_merge: false
# Scope auto-approval: off | trivial | standard | all.
auto_approve_scope: off
# Per-chat per-day USD ceiling for autonomy-originated runs (verify/goal/CI/follow-ups).
auto_task_max_cost_per_day: "20.0"
# followup/<delay>.md convention + the "I'll report back" promise nudge.
enable_promise_nudge: true
