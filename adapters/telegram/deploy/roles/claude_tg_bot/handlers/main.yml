---
# Convenience handler (e.g. for `--tags restart`). The converge task
# "(Re)start the bot on its current image" already runs
# `docker compose up -d --force-recreate`, which is idempotent.
- name: Restart claude-tg-bot
  ansible.builtin.command:
    cmd: docker compose restart
    chdir: "{{ app_dir }}"
